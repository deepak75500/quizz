[project]
name = "quizz"
version = "0.1.0"
description = "UGC NET Question Extraction API"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "playwright",
    "pydantic",
    "requests",
    "PyMuPDF",
    "pytesseract",
    "beautifulsoup4",
    "Pillow",
    "python-multipart"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]
